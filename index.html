<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a3d40">
<title>The Beach Club Krabi — AI Host</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--teal:#0e6b6b;--tealdk:#0a3d40;--ink:#12262b;--paper:#fbf8f1;
--acc:#c9a227;--accInk:#7a5f10;--accSh:rgba(201,162,39,.4);--accB:rgba(201,162,39,.55);--accBg:rgba(201,162,39,.08);
}
body.malee{--acc:#b8623a;--accInk:#8a4425;--accSh:rgba(184,98,58,.4);--accB:rgba(184,98,58,.55);--accBg:rgba(184,98,58,.08)}
html,body{margin:0;padding:0;height:100%}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
color:var(--ink);overflow:hidden;
background:linear-gradient(180deg,#0a3d40 0%,#14676a 28%,#3f9c93 52%,#e9b678 82%,#f4d3a4 100%);
background-attachment:fixed;
}
body:before{content:'';position:fixed;left:50%;bottom:-160px;width:620px;height:420px;transform:translateX(-50%);
pointer-events:none;background:radial-gradient(closest-side,rgba(255,240,214,.85),rgba(255,240,214,0))}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}

@keyframes bcRise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes bcFade{from{opacity:0}to{opacity:1}}
@keyframes bcPop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bcSheen{0%{transform:translate(-30%,-10%) rotate(8deg)}100%{transform:translate(30%,10%) rotate(8deg)}}
@keyframes bcWave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes bcRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes bcDot{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- TOP BAR ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;
background:linear-gradient(180deg,rgba(10,61,64,.82),rgba(10,61,64,0))}
.brand{margin-right:auto;line-height:1.15;color:#fff}
.brand b{display:block;font-size:11px;letter-spacing:.22em;font-weight:700}
.brand b em{font-style:normal;color:#f4d3a4}
.brand span{display:block;font-size:7px;letter-spacing:.34em;color:rgba(255,255,255,.55);margin-top:2px}
.pillrow{display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;
border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
color:#fff;font-size:12px;font-weight:600;cursor:pointer}
#pVoice{padding:0;width:34px;justify-content:center;font-size:14px}
#pVoice:not(.on){background:rgba(255,255,255,.06)}
.pill.cartb{border:none;background:var(--acc);font-weight:700;box-shadow:0 6px 16px var(--accSh)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#fff;color:var(--accInk);
font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ---------- AVATAR ---------- */
.stage{flex:none;display:flex;align-items:center;gap:13px;padding:2px 16px 12px;transition:opacity .5s ease}
body.vtalk .stage{opacity:0}
/* elle garde TOUJOURS le même format : 90×118, aucun redimensionnement */
.av{position:relative;flex:none;width:90px;height:118px;border-radius:20px;overflow:hidden;cursor:pointer;
background:linear-gradient(155deg,#0c4c50,#2b7f7c 45%,#d9a86f);
box-shadow:0 12px 30px rgba(6,40,44,.4),0 0 0 2px rgba(255,255,255,.6)}
.av:after{content:'';position:absolute;inset:-40%;z-index:3;pointer-events:none;
background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.2) 50%,rgba(255,255,255,0) 62%);
animation:bcSheen 5.5s ease-in-out infinite alternate}
.av .avvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:none;z-index:2;background:#0d2f2c}
.av.live .avvid{display:block}
.av.live .photo{display:none}
.av .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:none;z-index:1}
.av.ph .photo{display:block}
.av.ph svg{display:none}
.av svg{position:absolute;inset:0;width:100%;height:100%}
.av .ring{position:absolute;inset:0;z-index:4;border-radius:inherit;border:2px solid rgba(255,255,255,.7);opacity:0;pointer-events:none}
.av.talk .ring{opacity:1;animation:bcRing 1.3s ease-out infinite}
.nameplate{min-width:0;line-height:1.1}
.nameplate b{display:block;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:28px;color:#fff}
.nameplate i{display:flex;align-items:center;gap:6px;font-style:normal;margin-top:3px;
font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.nameplate i:before{content:'';flex:none;width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.5)}
.stage:has(.av.talk) .nameplate i:before{background:#7dffb2}
.stage .st-spk{display:none}
.stage:has(.av.talk) .st-spk{display:inline}
.stage:has(.av.talk) .st-ctx{display:none}
.ibars span{width:3px;border-radius:2px;background:rgba(255,255,255,.9);transform-origin:bottom;animation:bcWave .8s ease-in-out infinite}
.ibars span:nth-child(1){height:8px;animation-duration:.5s}
.ibars span:nth-child(2){height:13px;animation-duration:.63s;animation-delay:.07s}
.ibars span:nth-child(3){height:18px;animation-duration:.76s;animation-delay:.14s}
.ibars span:nth-child(4){height:8px;animation-duration:.89s;animation-delay:.21s}
.ibars span:nth-child(5){height:13px;animation-duration:.5s;animation-delay:.28s}
.ibars span:nth-child(6){height:18px;animation-duration:.63s;animation-delay:.35s}
.ibars span:nth-child(7){height:8px;animation-duration:.76s;animation-delay:.42s}

/* ---------- FILTER SUMMARY ---------- */
.fsum{align-self:center;display:none;align-items:center;gap:8px;margin:0 16px 4px;padding:7px 14px;border-radius:999px;
border:1px solid rgba(201,162,39,.55);background:rgba(255,251,240,.92);color:#7a5f10;font-size:11.5px;font-weight:600;
cursor:pointer;box-shadow:0 4px 14px rgba(20,60,60,.12);animation:bcPop .3s both}
.fsum.on{display:flex}

/* ---------- CHAT ---------- */
.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 14px;display:flex;flex-direction:column;gap:14px;
-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px);mask-image:linear-gradient(180deg,transparent 0,#000 16px)}
.chat>:first-child{margin-top:auto}
.chat::-webkit-scrollbar{display:none}
.msg{max-width:88%;padding:13px 17px;font-size:15px;line-height:1.5;animation:bcPop .3s ease both;white-space:pre-wrap;text-wrap:pretty}
.msg.a{align-self:flex-start;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.94);color:#12262b;box-shadow:0 8px 20px rgba(20,60,60,.14)}
.msg.u{align-self:flex-end;max-width:82%;padding:12px 17px;border-radius:18px 18px 6px 18px;background:#0e6b6b;color:#fff;box-shadow:0 8px 20px rgba(14,107,107,.3)}
.typing{display:flex;gap:5px;align-items:center;padding:13px 16px}
.typing i{width:6px;height:6px;border-radius:999px;background:#0e6b6b;animation:bcDot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}

/* ---------- DISH CARDS ---------- */
.cards{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:11px;align-items:center;padding:9px;border-radius:16px;background:rgba(255,255,255,.96);
border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(20,60,60,.13);animation:bcPop .35s both}
.card .em{position:relative;flex:none;width:60px;height:60px;border-radius:13px;display:flex;align-items:center;justify-content:center;
font-size:28px;overflow:hidden;background:linear-gradient(150deg,#3f8f7d,#d9a86f)}
.card .em.zoom{cursor:pointer}
.card .em img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .em .zm{position:absolute;right:4px;bottom:4px;width:16px;height:16px;border-radius:5px;background:rgba(10,40,44,.55);
color:#fff;font-size:11px;line-height:16px;text-align:center;z-index:2}
.card .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .ttl b{font-size:14px;font-weight:650;line-height:1.2;color:#12262b}
.card .tn{display:block;font-style:normal;font-size:12px;color:rgba(18,38,43,.62)}
.card .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;align-self:stretch;justify-content:space-between;padding:2px 0}
.card .pr{font-size:15px;font-weight:750;color:#0e6b6b;letter-spacing:-.01em;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.03em;border:1px solid}
.tag.t-shellfish{background:#fdeae2;color:#9a3412;border-color:#f0b79a}
.tag.t-gluten{background:#fbf0d8;color:#854d0e;border-color:#e6c885}
.tag.t-beef{background:#fbe4ea;color:#9f1239;border-color:#eeaabd}
.tag.t-nut{background:#f4e6dc;color:#7c2d12;border-color:#dcb79c}
.tag.t-dairy{background:#eef2fb;color:#3b4f8f;border-color:#b9c6ea}
.tag.t-egg{background:#fdf3d9;color:#8a6d1a;border-color:#ecd28a}
.tag.t-fish{background:#e3f0f6;color:#155e75;border-color:#a5cddd}
.tag.t-soy{background:#efe9dc;color:#6b5426;border-color:#d3c39a}
.tag.t-sesame{background:#f3ede3;color:#7c6142;border-color:#dbc9ae}
.tag.t-spicy{background:#fde6e0;color:#b91c1c;border-color:#f3a89b}
.tag.vg{background:#e3f3e6;color:#166534;border-color:#a6d6b1}
.add{flex:none;width:34px;height:34px;border-radius:999px;border:none;background:var(--acc);color:#fff;font-size:20px;font-weight:700;
line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 14px var(--accSh);transition:transform .15s}
.add:active{transform:scale(.88)}
.add.done{background:#15803d;font-size:14px}

/* ---------- UPSELL : mini-pastilles dans le chat, une ligne, zéro encombrement ---------- */
.ups{align-self:flex-start;display:flex;gap:7px;max-width:92%;overflow-x:auto;scrollbar-width:none;animation:bcPop .3s both}
.ups::-webkit-scrollbar{display:none}
.upc{flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border:1px solid var(--accB);
border-radius:999px;padding:7px 8px 7px 12px;font-size:12.5px;font-weight:600;color:#12262b;cursor:pointer;
box-shadow:0 4px 14px rgba(20,60,60,.12);white-space:nowrap}
.upc span{font-size:15px;line-height:1}
.upc b{width:20px;height:20px;border-radius:999px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-left:2px}
.upc:active{transform:scale(.95)}
.upc.done{opacity:.7;padding:7px 12px}

/* ---------- CHIPS + INPUT ---------- */
.chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;border:1px solid var(--accB);background:rgba(255,255,255,.82);
color:#12262b;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:active{transform:scale(.95)}
.dock{flex:none;display:flex;align-items:center;gap:9px;padding:12px 14px calc(env(safe-area-inset-bottom) + 18px);
background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.5))}
.inp{flex:1;display:flex;align-items:center;height:52px;padding:0 6px 0 18px;border-radius:999px;background:rgba(255,255,255,.94);
border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(20,60,60,.16)}
.inp input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:#12262b;font-family:inherit}
.mic{flex:none;width:40px;height:40px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(18,38,43,.06);font-size:15px}
.mic.on{background:#e5484d;color:#fff;animation:micp 1.15s ease-out infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 15px rgba(229,72,77,0)}}
.snd{flex:none;width:52px;height:52px;border-radius:999px;border:none;background:var(--acc);color:#fff;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px var(--accSh);transition:transform .15s}
.snd:active{transform:scale(.92)}

/* ---------- SHEETS ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,32,36,.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--paper);z-index:50;
border-radius:26px 26px 0 0;transform:translateY(105%);transition:.34s cubic-bezier(.22,1,.36,1);
max-height:88vh;display:flex;flex-direction:column;padding:12px 20px calc(env(safe-area-inset-bottom) + 26px);
box-shadow:0 -18px 50px rgba(6,40,44,.3)}
.sheet.on{transform:none}
.sheet:before{content:'';flex:none;width:38px;height:4px;border-radius:999px;background:rgba(18,38,43,.18);margin:0 auto 16px}
.sheet h3{flex:none;margin:0 0 14px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(18,38,43,.5);
font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .x{font-size:20px;color:rgba(18,38,43,.35);cursor:pointer;line-height:1;padding:0 2px;letter-spacing:0}
.sheet .bd{overflow-y:auto;min-height:0}
.lang{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:16px 44px 16px 18px;margin-bottom:8px;
border-radius:16px;cursor:pointer;font-size:16px;font-weight:600;color:#12262b;border:1.5px solid rgba(18,38,43,.1);background:#fff}
.lang b{font-size:20px;line-height:1;font-weight:400}
.lang:after{content:'✓';position:absolute;right:18px;color:var(--acc);font-size:16px;opacity:0}
.lang.on{border-color:var(--acc);background:var(--accBg)}
.lang.on:after{opacity:1}
.crow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid rgba(18,38,43,.07);margin-bottom:10px}
.crow .cth{flex:none;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-size:20px;background:linear-gradient(150deg,#3f8f7d,#d9a86f)}
.crow .cth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.crow .cin{flex:1;min-width:0}
.crow .cin b{display:block;font-size:14px;font-weight:650;color:#12262b}
.crow .cin span{display:block;font-size:12.5px;color:rgba(18,38,43,.55);margin-top:2px}
.crow .stp{display:flex;align-items:center;gap:4px}
.crow .stp button{width:30px;height:30px;border-radius:999px;border:1px solid rgba(18,38,43,.14);background:#fff;font-size:16px;color:#12262b;cursor:pointer;line-height:1}
.crow .stp b{min-width:20px;text-align:center;font-size:14px;font-weight:700}
.totals{margin-top:4px;padding-top:14px;border-top:1px dashed rgba(18,38,43,.18);display:flex;flex-direction:column;gap:6px;font-size:13px;color:rgba(18,38,43,.65)}
.totals .r{display:flex}
.totals .r span:first-child{flex:1}
.totals .tt{display:flex;align-items:baseline;margin-top:6px;color:#12262b}
.totals .tt span:first-child{flex:1;font-size:15px;font-weight:700}
.totals .tt span:last-child{font-size:20px;font-weight:750;color:#0e6b6b}
.btn{display:block;width:100%;border:none;border-radius:18px;background:#0e6b6b;color:#fff;font-size:16px;font-weight:700;
height:56px;margin-top:16px;cursor:pointer;font-family:inherit;box-shadow:0 12px 28px rgba(14,107,107,.34);transition:background .3s}
.btn:active{transform:scale(.98)}
.btn.sent{background:#15803d}
.note{font-size:11px;color:rgba(18,38,43,.5);text-align:center;margin-top:9px;line-height:1.4}
.fhint{font-size:13px;color:rgba(18,38,43,.6);line-height:1.45;margin:-6px 0 16px}
.drow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;margin-bottom:8px;border-radius:16px;cursor:pointer;
border:1.5px solid rgba(18,38,43,.1);background:#fff}
.drow.on{border-color:var(--acc);background:var(--accBg)}
.drow .dt{width:9px;height:9px;border-radius:999px;flex:none;background:#12262b}
.drow b{flex:1;text-align:left;font-size:15px;font-weight:600;color:#12262b}
.drow .sw{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:rgba(18,38,43,.16);transition:background .2s}
.drow.on .sw{background:var(--acc)}
.drow .sw:before{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.drow.on .sw:before{left:21px}
.ok{text-align:center;padding:26px 20px}
.ok .ic{font-size:52px;animation:bcPop .5s cubic-bezier(.2,1.6,.5,1)}
.ok b{display:block;font-size:19px;font-weight:800;margin-top:10px}
.ok p{font-size:13.5px;color:rgba(18,38,43,.6);margin:6px 0 0;line-height:1.5}

/* ---------- LIGHTBOX ---------- */
.lbw{position:fixed;inset:0;z-index:60;background:rgba(8,32,36,.72);backdrop-filter:blur(8px);display:none;
flex-direction:column;justify-content:flex-end;max-width:520px;margin:0 auto}
.lbw.on{display:flex;animation:bcFade .2s ease}
.lbw .sp{flex:1}
.lb{background:var(--paper);border-radius:26px 26px 0 0;overflow:hidden;animation:bcRise .34s cubic-bezier(.22,1,.36,1);padding-bottom:env(safe-area-inset-bottom)}
.lb .ph{position:relative;height:250px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(150deg,#3f8f7d,#d9a86f)}
.lb .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lb .ph .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;border:none;background:rgba(8,32,36,.5);
color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);z-index:2}
.lb .bd2{padding:18px 20px 24px}
.lb .hd{display:flex;align-items:flex-start;gap:12px}
.lb .hd .nm2{flex:1}
.lb .hd .nm2 b{display:block;font-size:20px;font-weight:700;color:#12262b;line-height:1.2}
.lb .hd .nm2 i{display:block;font-style:normal;font-size:14px;color:rgba(18,38,43,.6);margin-top:3px}
.lb .hd .pr2{font-size:22px;font-weight:750;color:#0e6b6b;white-space:nowrap}
.lb .ds2{margin-top:10px;font-size:14px;line-height:1.5;color:rgba(18,38,43,.72);text-wrap:pretty}
.lb .tags{margin-top:12px}
.lb .btn2{width:100%;margin-top:16px;height:54px;border-radius:16px;border:none;cursor:pointer;font-size:16px;font-weight:700;
font-family:inherit;color:#fff;background:var(--acc);box-shadow:0 12px 26px var(--accSh)}

/* ===== scan intro ===== */
.intro{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;
padding:calc(env(safe-area-inset-top) + 34px) 26px calc(30px + env(safe-area-inset-bottom));opacity:1;
transition:opacity .55s ease,padding .65s cubic-bezier(.3,.9,.3,1)}
.intro:before{content:'';position:absolute;inset:0;z-index:-1;
background:linear-gradient(180deg,#0a3d40 0%,#14676a 28%,#3f9c93 52%,#e9b678 82%,#f4d3a4 100%);transition:opacity .6s ease}
.intro:after{content:'';position:absolute;left:50%;bottom:-160px;width:620px;height:420px;transform:translateX(-50%);z-index:-1;
pointer-events:none;background:radial-gradient(closest-side,rgba(255,240,214,.85),rgba(255,240,214,0));transition:opacity .6s ease}
.intro.gone{opacity:0;pointer-events:none}
/* pendant qu'elle parle : le fond s'efface, la carte glisse EXACTEMENT au format et à la place
   de l'avatar du chat (90×118, arrondi 20) — aucun saut de taille au raccord */
.intro.talking{pointer-events:none;align-items:flex-start;padding-left:16px;padding-top:calc(env(safe-area-inset-top) + 60px)}
.intro.talking:before,.intro.talking:after{opacity:0}
.ibrand{color:rgba(255,255,255,.92);text-align:center;line-height:1;transition:opacity .35s ease,max-height .55s ease;max-height:60px;overflow:hidden}

.ivid{position:relative;margin-top:26px;width:262px;height:350px;border-radius:22px;overflow:hidden;

animation:ipop .8s cubic-bezier(.2,1.3,.4,1) both;

.intro.talking .ivid{width:90px;height:118px;border-radius:20px;margin-top:0;pointer-events:auto;cursor:pointer;

@keyframes ipop{0%{opacity:0;transform:scale(.82) translateY(26px)}100%{opacity:1;transform:none}}
.ivid:before{content:'';position:absolute;inset:-40%;z-index:3;pointer-events:none;
background:linear-gradient(100deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 62%);
animation:bcSheen 5.5s ease-in-out infinite alternate}
.ivid video,.ivid img.fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
.ivid img.fb{z-index:0}
.ivid video{z-index:1;opacity:0;transition:opacity .6s ease}
.ivid video.rdy{opacity:1}
#italk{z-index:2}
.ivid:after{content:'';position:absolute;left:0;right:0;bottom:0;height:120px;z-index:3;pointer-events:none;

.intro.talking .ivid:after,.intro.talking .ilive{opacity:0}

letter-spacing:.2em;padding:5px 10px 5px 8px;border-radius:999px;transition:opacity .3s}
.ilive i{width:6px;height:6px;border-radius:999px;background:#ff5f56;animation:bcDot 1.4s infinite}
.ibars{position:absolute;left:0;right:0;bottom:14px;z-index:4;display:flex;justify-content:center;align-items:flex-end;gap:3px;height:20px;opacity:0;transition:opacity .3s}
.ivid.spk .ibars{opacity:1}
.iname{margin-top:22px;font-family:Georgia,'Times New Roman',serif;font-size:38px;line-height:1;color:#fff;

.irole{margin-top:8px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.78);animation:iup .7s .3s both}
.ipick{margin-top:auto;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(18,38,43,.6);font-weight:600;animation:iup .7s .38s both}
@keyframes iup{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
.iflags{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:340px;animation:iup .7s .46s both}
.isoon{margin-top:12px;font-size:11px;color:rgba(18,38,43,.5);animation:iup .7s .54s both}
.iname,.irole,.ipick,.iflags,.isoon{max-height:96px;overflow:hidden;
transition:opacity .35s ease,max-height .55s ease,margin .55s ease}
.intro.talking .iname,.intro.talking .irole,.intro.talking .ipick,
.intro.talking .iflags,.intro.talking .isoon{opacity:0;max-height:0;margin:0}

.iflag:active{transform:scale(.93);background:#fff}

/* les clients tapent sans accents : « reserver », « ou etes vous » doivent matcher quand même */
function nrm(s){try{return s.normalize('NFD').replace(/[̀-ͯ]/g,'')}catch(e){return s}}
function hit(s,list){var ns=nrm(s);for(var i=0;i<list.length;i++){if(s.indexOf(list[i])>-1||ns.indexOf(nrm(list[i]))>-1)return true}return false}

function pick(f,n){var r=D.filter(f);return n?r.slice(0,n):r}
function safe(list){ // remove dishes matching active allergen filters
  if(!FILT.length)return list;
  return list.filter(function(d){
    for(var i=0;i<FILT.length;i++){
      if(FILT[i]==='veg'){if(!d.v)return false}
      else if(d.a.indexOf(FILT[i])>-1)return false;
    }return true});
}

function respond(raw){
  var s=' '+raw.toLowerCase().replace(/[’']/g,'\'')+' ';
  var t=T[L], C=ROLE==='concierge';

  if(C){
    if(hit(s,K.spa))     return {t:svcTxt('spa'),svc:['spa']};
    if(hit(s,K.tour))    return {t:svcTxt('tour'),svc:['tour']};
    if(hit(s,K.taxi))    return {t:svcTxt('taxi'),svc:['taxi']};
    if(hit(s,K.late))    return {t:svcTxt('late'),svc:['late']};
    if(hit(s,K.towel))   return {t:svcTxt('house'),svc:['house']};
    if(hit(s,K.bfast))   return {t:svcTxt('bfast'),svc:['bfast']};
    if(hit(s,K.laundry)) return {t:svcTxt('laundry'),svc:['laundry']};
    if(hit(s,K.roomsvc)) return {t:svcTxt('rs'),svc:['rs']};
    if(hit(s,K.services))return {t:t.serv,svc:S.map(function(x){return x.id})};
  }

  var al=[];
  if(hit(s,K.alg_gluten))al.push('gluten');
  if(hit(s,K.alg_nut))al.push('nut');
  if(hit(s,K.alg_shell))al.push('shellfish');
  if(hit(s,K.alg_dairy))al.push('dairy');
  if(hit(s,K.alg_egg))al.push('egg');
  if(hit(s,K.alg_fish))al.push('fish');
  if(al.length){
    FILT=al.slice(); syncFilt();
    var ok=safe(D.filter(function(d){return d.c!=='drink'}));
    var nm=al.map(function(a){return ALG[a][L]}).join(' / ');
    if(!ok.length)return {t:t.nofilt};
    return {t:t.alg.replace('{A}',nm),items:ok.slice(0,6)};
  }
  if(hit(s,K.allergy)) {openSheet('filt');return {t:t.filt+' →'}}
  if(hit(s,K.veg))     return {t:t.veg,items:safe(pick(function(d){return d.v&&d.c!=='drink'},6))};
  if(hit(s,K.spicy))   return cat(t.spicy,function(d){return d.sp});
  if(hit(s,K.pasta))   return cat(t.pasta,function(d){return d.c==='pasta'});
  if(hit(s,K.pizza))   return cat(t.pizza,function(d){return d.c==='pizza'});
  if(hit(s,K.tapas))   return cat(t.tapas,function(d){return d.c==='tapas'});
  if(hit(s,K.burger))  return cat(t.burger,function(d){return d.c==='burger'});
  if(hit(s,K.salad))   return cat(t.salad,function(d){return d.c==='salad'});
  if(hit(s,K.thai))    return cat(t.thai,function(d){return d.c==='thai'});
  if(hit(s,K.dess))    return cat(t.dess,function(d){return d.c==='dess'});
  if(hit(s,K.cocktail))return cat(t.cocktail||t.drink,function(d){return d.g==='cocktail'||d.g==='mocktail'});
  if(hit(s,K.beer))    return cat(t.beer||t.drink,function(d){return d.g==='beer'});
  if(hit(s,K.smoothie))return cat(t.smoothie||t.drink,function(d){return d.g==='smoothie'||d.g==='juice'});
  if(hit(s,K.drink))   return cat(t.drink,function(d){return d.c==='drink'});
  if(hit(s,K.meat))    return cat(t.meat,function(d){return d.c==='meat'});
  if(hit(s,K.sea))     return cat(t.sea,function(d){return d.a.indexOf('fish')>-1||d.a.indexOf('shellfish')>-1});
  if(hit(s,K.start))   return cat(t.start,function(d){return d.c==='start'});
  /* infos pratiques — avant recommend (« what should we do for my birthday ») et hours (« what time is sunset ») */
  if(hit(s,K.bday))    return {t:t.bday};
  if(hit(s,K.takeaway))return {t:t.takeaway};
  if(hit(s,K.reserve)) return {t:t.reserve};
  if(hit(s,K.sunset))  return {t:t.sunset};
  if(hit(s,K.rain))    return {t:t.rain};
  if(hit(s,K.music))   return {t:t.music};
  if(hit(s,K.smoke))   return {t:t.smoke};
  if(hit(s,K.pets))    return {t:t.pets};
  if(hit(s,K.park))    return {t:t.park};
  if(hit(s,K.loc))     return {t:t.loc};
  if(hit(s,K.recommend))return{t:t.rec,items:safe(D.filter(function(d){return ['oriental','seabass','padthai','margherita','mango'].indexOf(d.id)>-1}))};
  if(hit(s,K.wifi))    return {t:t.wifi};
  if(hit(s,K.hours))   return {t:t.hours};
  if(hit(s,K.bill))    return {t:t.bill};
  if(hit(s,K.kids))    return {t:t.kids};
  if(hit(s,K.pool))    return {t:t.pool};
  if(hit(s,K.waiter))  return {t:t.waiter};
  if(hit(s,K.thanks))  return {t:t.thanks};
  if(hit(s,K.greet))   return {t:(C?t.cgreet:t.greet).replace('{T}',TABLE).replace('{R}',ROOM).replace('{N}',NAME)};
  /* name match on any dish */
  var m=D.filter(function(d){
    var c=[d.n]; if(d.nn&&d.nn[L])c.push(d.nn[L]); if(d.tn)c.push(d.tn);
    for(var k=0;k<c.length;k++){var w=c[k].split(' ')[0];if(w.length>3&&s.indexOf(w.toLowerCase())>-1)return true}
    return false});
  if(m.length)return {t:t.rec,items:m.slice(0,3)};
  return {t:C?t.cfb:t.fb};
}
function cat(txt,f){
  var all=safe(D.filter(f)), t=T[L];
  if(!all.length)return {t:t.nofilt};
  if(all.length>8)txt=txt.replace(/[\s]*[:：]+[\s]*$/,'')+'… '+t.more.replace(/^[…\s]+/,'');
  return {t:txt,items:all.slice(0,8)};
}
function svcTxt(id){var x=S.filter(function(y){return y.id===id})[0];return x.n[L]+' — '+x.d[L]}

<script>
/* ============ RENDER ============ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function bubble(cls,html){
  var d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;
  $('chat').appendChild(d);scroll();return d;
}
function scroll(){var c=$('chat');setTimeout(function(){c.scrollTop=c.scrollHeight},30)}

function nm(d){return (d.nn&&d.nn[L])||d.n}
function price(d){
  if(!d.p)return T[L].byweight;
  return d.p2?d.p+' / '+d.p2+' ฿':d.p+' ฿';
}
/* les vraies photos du restaurant (extraites du PDF du client) ; emoji en repli */
var PHOTOS={};'mixbrusc oriental carpaccio calamari nachos coldcut burrataburger fishburger chicksand cheeseplate sweetsour gardenrolls peekgai satay glassnoodle prawncake nuekhem softshell padthai khaophad roticurry khaoob krapao crabnoodle octopussalad kalesalad greensalad burratasalad rocket proteinbowl seafoodbbq tartare paella lobster oysters chickenbbq kebab beefbbq bresaola pollopicante salamipizza andaman marimonti carbonara risotto vongole poveromare bolognese linguine mango banfritter cremacat rotitob tiramisu icecream latte'.split(' ').forEach(function(x){PHOTOS[x]=1});
function tagsHTML(d){
  var tags='';
  d.a.forEach(function(a){tags+='<span class="tag t-'+a+'">'+ALG[a][L]+'</span>'});
  if(d.v)tags+='<span class="tag vg">'+(d.v===2?VEGO[L]:VEGL[L])+'</span>';
  return tags;
}
function dishHTML(d,i){
  /* la photo ouvre la fiche plein format (lightbox) ; emoji en repli */
  var vis=PHOTOS[d.id]
   ?'<div class="em zoom" onclick="openLB(\''+d.id+'\')"><img src="media/dishes/'+d.id+'.webp" loading="lazy" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'none\';this.parentNode.insertAdjacentText(\'afterbegin\',\''+d.e+'\')"><span class="zm">&#10530;</span></div>'
   :'<div class="em zoom" onclick="openLB(\''+d.id+'\')">'+d.e+'</div>';

  return '<div class="card" style="animation-delay:'+(i*60)+'ms">'
   +vis+'<div class="in">'
   +'<div class="ttl"><b>'+esc(nm(d))+'</b>'+(d.tn?'<i class="tn">'+d.tn+'</i>':'')+'</div>'
   +'<div class="tags">'+tagsHTML(d)+'</div></div>'
   +'<div class="right"><span class="pr">'+price(d)+'</span>'
   +'<button class="add" onclick="addCart(\''+d.id+'\',this)">+</button></div></div>';

function svcHTML(x,i){
  return '<div class="card" style="animation-delay:'+(i*60)+'ms">'
   +'<div class="em">'+x.e+'</div><div class="in">'
   +'<div class="ttl"><b>'+esc(x.n[L])+'</b></div>'
   +'<div class="tn">'+esc(x.d[L])+'</div></div>'
   +'<div class="right"><span class="pr">'+(x.p?x.p+' ฿':T[L].free)+'</span>'
   +'<button class="add" onclick="addSvc(\''+x.id+'\',this)">+</button></div></div>';
}
/* ============ FICHE PLAT (lightbox) ============ */
function openLB(id){
  var d=D.filter(function(x){return x.id===id})[0];
  if(!d)return;
  var ph=$('lbPh');
  ph.innerHTML='<button class="x" onclick="closeLB()">&#10005;</button>'
   +(PHOTOS[d.id]?'<img src="media/dishes/'+d.id+'.webp" alt="">':'<span>'+d.e+'</span>');
  $('lbNm').textContent=nm(d);
  $('lbTn').textContent=d.tn||'';$('lbTn').style.display=d.tn?'':'none';
  $('lbPr').textContent=price(d);
  $('lbDs').textContent=d.d[L]||d.d.en;
  $('lbTags').innerHTML=tagsHTML(d);
  $('lbAdd').textContent=LBADD[L]+' · '+price(d);
  $('lbAdd').onclick=function(){addCart(d.id,null);closeLB()};
  $('lbw').classList.add('on');
}
function closeLB(){$('lbw').classList.remove('on')}
function showCards(html){
  var d=document.createElement('div');d.className='cards';d.innerHTML=html;
  $('chat').appendChild(d);scroll();
}

(function(){
  var ks=['veg','spicy','pasta','pizza','tapas','burger','salad','thai','dess','drink','cocktail','beer','smoothie','nofilt'];
  ['en','th'].forEach(function(lg){
    if(!T[lg])return;
    ks.forEach(function(k){
      if(!T[lg][k])return;
      var f='media/voice/'+lg+'-'+k+'.mp3';
      VFILES[lg+'|'+T[lg][k]]=f;
      /* variante « …et plus encore » ajoutée par cat() quand la liste dépasse 8 items */

function speak(txt){
  if(!VOICE)return;
  var f=VFILES[L+'|'+txt];
  if(f){
    try{
      if(VAU){try{VAU.pause()}catch(e){}}
      if(window.speechSynthesis)speechSynthesis.cancel();
      VAU=new Audio(f);
      VAU.onplay=function(){$('av').classList.add('talk')};
      VAU.onended=function(){$('av').classList.remove('talk')};
      var pr=VAU.play();
      if(pr&&pr.catch)pr.catch(function(){synthSpeak(txt)});
      return;
    }catch(e){}
  }
  synthSpeak(txt);
}
function synthSpeak(txt){
  if(!VOICE||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt.replace(/[฿]/g,''));
    var lv=LANGS.filter(function(x){return x.c===L})[0].v;
    u.lang=lv;u.rate=.98;u.pitch=1.08;
    var vs=speechSynthesis.getVoices()||[];
    var f=vs.filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(lv.slice(0,2))===0});
    var fem=f.filter(function(v){return /female|woman|samantha|amelie|amélie|anna|milena|tingting|kanya|zira|google/i.test(v.name)});
    if(fem[0])u.voice=fem[0];else if(f[0])u.voice=f[0];
    u.onstart=function(){$('av').classList.add('talk')};
    u.onend=function(){$('av').classList.remove('talk')};
    speechSynthesis.speak(u);
  }catch(e){}
}

function say(text,cb,mute){
  BUSY=true;
  /* jamais deux voix en même temps : si le clip vidéo d'accueil parle encore, on le coupe
     avant qu'elle dise autre chose (le greeting muet pendant le clip n'est pas concerné) */
  if(!mute){try{var tvk=$('italk');if(tvk&&!tvk.paused&&!tvk.ended)introTalkEnd()}catch(e){}}
  var tp=bubble('a','<div class="typing"><i></i><i></i><i></i></div>');
  $('av').classList.add('talk');
  var wait=Math.min(1500,500+text.length*7);
  setTimeout(function(){
    tp.remove();bubble('a',esc(text));if(!mute)speak(text);
    if(!VOICE||mute)setTimeout(function(){$('av').classList.remove('talk')},600);
    BUSY=false;if(cb)cb();
  },wait);
}

var VN=Math.max(1,parseInt(Q.get('v')||'1',10)||1);
var VID={}; for(var _r in VIDS){VID[_r]=VIDS[_r][Math.min(VN,VIDS[_r].length)-1]}

var INTRO_ON=true;
function introInit(){
  var el=$('intro');
  if(!VID[ROLE]){el.parentNode.removeChild(el);INTRO_ON=false;return}
  $('iname').textContent=NAME;

  $('iflags').innerHTML=LANGS.map(function(x){

  }).join('');
  /* on précharge les clips parlés pendant qu'il choisit sa langue : au tap, ça part tout de suite.
     fetch explicite (pas un simple prefetch) : les navigateurs ignorent souvent rel=prefetch en 4G */
  try{var sp=SPK[ROLE]||{};for(var k in sp){fetch(sp[k]).catch(function(){})}}catch(e){}
  /* elle parle dès l'apparition quand le navigateur l'autorise ;
     sinon le tout premier toucher, où qu'il soit, déclenche le son */
  introSpeakNow();
  document.addEventListener('pointerdown',function(){introSpeakNow()},{once:true,capture:true});
}
/* clip parlé à l'apparition — ASPK : 0 pas lancé, 1 en cours, 2 entendu en entier */
var ASPK=0,ASRC='';
function introSpeakNow(){
  if(!INTRO_ON||ASPK)return;
  var src=(SPK[ROLE]||{})[L]; if(!src)return;
  var tv=$('italk'),v=$('ivid');
  ASRC=src;
  tv.loop=false; tv.muted=false; tv.volume=1;
  if(tv.getAttribute('src')!==src)tv.src=src;
  tv.onplaying=function(){ ASPK=1; TALKED=true; tv.classList.add('rdy'); tv.parentNode.classList.add('spk'); try{v.pause()}catch(e){} };
  tv.onended=tv.onerror=function(){
    if(ASPK!==1)return;
    /* fin du clip : retour à la boucle muette, il choisit sa langue tranquillement */
    ASPK=2; tv.classList.remove('rdy'); tv.parentNode.classList.remove('spk');
    var p=v.play(); if(p&&p.catch)p.catch(function(){});
  };
  var p=tv.play();
  if(p&&p.catch)p.catch(function(){ /* autoplay sonore refusé : on attend le premier toucher */ });
}
function introGo(c){
  if(!INTRO_ON)return; INTRO_ON=false;
  /* the tap is the user gesture that unlocks audio on iOS */
  try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  L=(c&&T[c])?c:L;
  applyLang();logE('lang',L);
  var el=$('intro'),v=$('ivid'),tv=$('italk');
  var src=(SPK[ROLE]||{})[L];
  if(!src){ /* pas de clip pour cette langue : chat direct, la synthèse dira le greeting */
    TALKED=false;
    el.classList.add('gone');
    setTimeout(function(){try{v.pause();tv.pause()}catch(e){}; if(el.parentNode)el.parentNode.removeChild(el)},700);
    setTimeout(function(){ introChat() },380);
    return;
  }
  if(src===ASRC&&ASPK===1){
    /* elle est déjà en train de le dire (parti à l'apparition) : on ne la coupe pas, on enchaîne */
    document.body.classList.add('vtalk');
    el.classList.add('talking');
    tv.onended=introTalkEnd; tv.onerror=introTalkEnd;
    setTimeout(introChatOnce,650);
    return;
  }
  if(src===ASRC&&ASPK===2){
    /* clip déjà entendu en entier à l'apparition : direct au chat, sans la faire répéter */
    el.classList.add('gone');
    setTimeout(function(){try{v.pause();tv.pause()}catch(e){}; if(el.parentNode)el.parentNode.removeChild(el)},700);
    setTimeout(introChatOnce,380);
    return;
  }
  /* elle switche de langue DANS la même carte (aucun saut de taille),
     le chat apparaît pendant qu'elle parle, la carte glisse en cercle en haut.
     Lecteur séparé JAMAIS muet : une vidéo démarrée en muet (la boucle d'intro)
     refuse souvent de repasser en sonore sur mobile — le tap débloque celui-ci. */
  document.body.classList.add('vtalk');
  el.classList.add('talking');
  tv.loop=false; tv.muted=false; tv.volume=1;
  if(tv.getAttribute('src')!==src)tv.src=src;
  tv.onended=introTalkEnd; tv.onerror=introTalkEnd;
  tv.onplaying=function(){
    tv.classList.add('rdy'); TALKED=true; tv.parentNode.classList.add('spk');
    try{v.pause()}catch(e){} /* la boucle muette reste visible dessous jusque-là : pas de trou noir */
    setTimeout(introChatOnce,650);
  };
  var p=tv.play();
  if(p&&p.catch)p.catch(function(){
    /* iPhone : play() sonore rejeté quand la vidéo n'a pas fini de charger.
       Le tap a déjà déverrouillé l'élément → on RETENTE en sonore dès que c'est prêt ;
       le muet n'est que l'ultime recours. */
    var done=false;
    var retry=function(){ if(done)return; done=true;
      var q=tv.play();
      if(q&&q.catch)q.catch(function(){ tv.muted=true; var r=tv.play(); if(r&&r.catch)r.catch(introTalkEnd) });
    };
    if(tv.readyState>=3)retry();
    else{tv.addEventListener('canplaythrough',retry,{once:true});setTimeout(retry,3000)}
  });
  /* filet de sécurité : si la vidéo ne démarre pas, la synthèse prend le relais */
  TWATCH=setTimeout(function(){ if(tv.currentTime<0.15)introTalkEnd() },9000);
}
var CHATTED=false;
function introChatOnce(){ if(CHATTED)return; CHATTED=true; introChat(); }
function introTalkEnd(){
  if(TWATCH){clearTimeout(TWATCH);TWATCH=null}
  var el=$('intro'),v=$('ivid');
  if(!el||!el.parentNode)return;
  try{v.parentNode.classList.remove('spk')}catch(e){}
  try{v.pause()}catch(e){}
  try{$('italk').pause()}catch(e){}
  document.body.classList.remove('vtalk');
  el.classList.add('gone');
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},700);
  introChatOnce();
}
function introChat(){
  var t=T[L];
  /* elle vient de le dire à voix haute : on n'oblige pas la synthèse à le répéter */
  say((ROLE==='concierge'?t.cgreet:t.greet).replace('{T}',TABLE).replace('{R}',ROOM).replace('{N}',NAME),function(){
    if(ROLE==='concierge')showCards(S.slice(0,3).map(svcHTML).join(''));
  },TALKED);
}

/* ============ ELLE PARLE ============ */
/* une vidéo parlée par langue ; les langues absentes passent direct au chat + voix de synthèse */
var SPK={waitress:{
  en:'media/spk-en.mp4',
  th:'media/spk-th.mp4'
}};
var TALKED=false;
var TWATCH=null;

/* ============ INIT ============ */
(function(){
  $('avsvg').innerHTML=avatarSVG(ROLE);
  // photo-realistic portraits; the drawn avatar stays as a fallback if they can't load
  if(PH[ROLE]){
    var pim=new Image();
    pim.onload=function(){$('avimg').src=PH[ROLE];$('av').classList.add('ph')};
    pim.src=PH[ROLE];
  }
  /* elle bouge pendant toute la conversation : boucle vidéo dans l'avatar (photo en repli) */
  var alv=(VIDS[ROLE]||[])[1]||(VIDS[ROLE]||[])[0];
  if(alv){
    var avv=$('avvid');
    avv.src=alv;
    avv.onplaying=function(){$('av').classList.add('live')};
    var pv=avv.play(); if(pv&&pv.catch)pv.catch(function(){});
  }
  $('anam').textContent=NAME;
  applyLang();
  if(window.speechSynthesis)speechSynthesis.getVoices();
  micInit();
  introInit();
  /* cache hors-ligne : vidéos+voix+photos disponibles même si le wifi lâche */
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(){
        setTimeout(function(){
          var urls=[],k;
          for(k in VFILES)if(urls.indexOf(VFILES[k])<0)urls.push(VFILES[k]);
          for(k in PHOTOS)urls.push('media/dishes/'+k+'.webp');
          (function next(){var u=urls.shift();if(!u)return;
            fetch(u).catch(function(){}).then(function(){setTimeout(next,150)})})();
        },4000);
      }).catch(function(){});
    });
  }
  if(!INTRO_ON){
    var t=T[L];
    setTimeout(function(){
      say((ROLE==='concierge'?t.cgreet:t.greet).replace('{T}',TABLE).replace('{R}',ROOM).replace('{N}',NAME),function(){
        if(ROLE==='concierge')showCards(S.slice(0,3).map(svcHTML).join(''));
      });
    },500);
  }
  document.addEventListener('touchstart',function unlock(){
    if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
    document.removeEventListener('touchstart',unlock);
  },{once:true});
})();
</script>
</body>
